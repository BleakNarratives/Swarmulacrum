<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OutClaw 3D Boardroom</title>
    <style>
        body { margin: 0; background: #050505; color: #0f0; font-family: monospace; overflow: hidden; }
        #boardroom { width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 10px; left: 10px; background: rgba(0,20,0,0.8); padding: 15px; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>OUTCLAW 3D BOARDROOM</h1>
        <div id="debate-container"></div>
    </div>
    <div id="boardroom"></div>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        
        // Scene Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('boardroom').appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040); 
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0x00ff00, 1);
        directionalLight.position.set(1, 1, 1);
        scene.add(directionalLight);
        
        // Agent Placeholders
        const agentColors = [0xff0000, 0x0000ff, 0xffff00];
        agentColors.forEach((color, i) => {
            const geometry = new THREE.SphereGeometry(0.5, 32, 32);
            const material = new THREE.MeshStandardMaterial({ color: color });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set((i - 1) * 2, 0, 0);
            scene.add(sphere);
        });
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        camera.position.z = 5;
        
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Connect to API
        async function fetchDebate() {
            try {
                const response = await fetch('/api/debate');
                const data = await response.json();
                const container = document.getElementById('debate-container');
                container.innerHTML = '<h3>Deliberation:</h3>';
                data.agents.forEach(agent => {
                    const div = document.createElement('div');
                    div.innerHTML = `<strong>${agent.name}</strong>: ${agent.opinion}<br><br>`;
                    container.appendChild(div);
                });
            } catch (e) {
                document.getElementById('debate-container').innerText = "System Offline - Backend not reachable.";
            }
        }
        
        fetchDebate();
    </script>
</body>
</html>
